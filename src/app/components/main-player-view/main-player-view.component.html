<div class="main-player-view-container">
  <header class="app-header">
    <div class="header-content-wrapper"> <!-- New wrapper for flex layout -->
      <h2 class="header-title">Media Player</h2> <!-- Potentially shorter title -->
      <app-search-container
        [currentProfileKey]="activeProfileIdForServiceView"
        class="header-search-container">
      </app-search-container>
    </div>
  </header>

  <main class="content-area">
    <div [ngSwitch]="currentView">
      <app-profile-selection
        *ngSwitchCase="'profiles'"
        [autoSelectProfileId]="activeProfileIdForServiceView"
        (providerSelected)="onProviderSelected($event)">
      </app-profile-selection>

      <app-category-navigation
        *ngSwitchCase="'categories'"
        [currentProviderId]="selectedProviderId"
        (itemSelected)="onPlayableItemSelected($event)"
        (categorySelected)="onCategoryNavigation($event)"
        (returnToServiceSelection)="onReturnToServiceSelection()">
      </app-category-navigation>

      <!--
        If currentView is 'player', it means a track was selected.
        Category navigation might be hidden or shown alongside.
        For this setup, if a track is selected (view becomes 'player'),
        we might want to keep showing categories for further navigation,
        or have a dedicated "now playing" view.
        Let's assume for now that when currentView is 'player',
        we might still want to see categories.
      -->
      <app-category-navigation
        *ngSwitchCase="'player'"
        [currentProviderId]="selectedProviderId"
        (itemSelected)="onPlayableItemSelected($event)"
        (categorySelected)="onCategoryNavigation($event)"
        (returnToServiceSelection)="onReturnToServiceSelection()">
      </app-category-navigation>

    </div>
  </main>

  <footer class="player-footer" *ngIf="websocketService.mediaPlayerState && websocketService.mediaPlayerState.nowPlayingData">
    <!-- Player component is always visible at the bottom once we move past profile selection -->
    <app-player></app-player>
  </footer>

  <!-- Alternative strategy: Player is part of the main content area when view is 'player' -->
  <!--
  <div *ngIf="currentView === 'player'" class="dedicated-player-area">
    <app-player></app-player>
  </div>
  -->

  <app-notification
    [message]="currentNotification!"
    *ngIf="currentNotification">
  </app-notification>
</div>
