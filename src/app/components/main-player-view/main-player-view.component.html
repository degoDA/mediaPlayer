<div class="main-player-view-container">
  <header class="app-header">
    <div class="header-content-wrapper"> <!-- New wrapper for flex layout -->
      <button class="header-main-back-button" (click)="goAppBack()" aria-label="Go back">
        &lt; Back
      </button>
      <h2 class="header-title">{{ currentHeaderTitle }}</h2> <!-- Re-added and bound -->
      <button class="search-toggle-button" (click)="toggleFullScreenSearch()" aria-label="Search">
        <svg class="search-svg-icon" viewBox="0 0 24 24" fill="currentColor" width="22px" height="22px">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5A6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          <path d="M0 0h24v24H0z" fill="none"/>
        </svg>
        <span class="search-label">Search</span>
      </button>
    </div>
  </header>

  <main class="content-area">
    <div [ngSwitch]="currentView">
      <app-profile-selection
        *ngSwitchCase="'profiles'"
        [autoSelectProfileId]="activeProfileIdForServiceView"
        (providerSelected)="onProviderSelected($event)"
        (profileContextUpdated)="onProfileContextUpdated($event)"
        (titleChanged)="onSubViewTitleChanged($event)">
      </app-profile-selection>

      <app-category-navigation
        *ngSwitchCase="'categories'"
        [currentProviderId]="selectedProviderId"
        (itemSelected)="onPlayableItemSelected($event)"
        (categorySelected)="onCategoryNavigation($event)"
        (titleChanged)="onSubViewTitleChanged($event)">
        <!-- (returnToServiceSelection) binding removed -->
      </app-category-navigation>

      <!--
        If currentView is 'player', it means a track was selected.
        Category navigation might be hidden or shown alongside.
        For this setup, if a track is selected (view becomes 'player'),
        we might want to keep showing categories for further navigation,
        or have a dedicated "now playing" view.
        Let's assume for now that when currentView is 'player',
        we might still want to see categories.
      -->
      <app-category-navigation
        *ngSwitchCase="'player'"
        [currentProviderId]="selectedProviderId"
        (itemSelected)="onPlayableItemSelected($event)"
        (categorySelected)="onCategoryNavigation($event)"
        (titleChanged)="onSubViewTitleChanged($event)">
        <!-- (returnToServiceSelection) binding removed -->
      </app-category-navigation>

      <app-now-playing-view
        *ngSwitchCase="'nowPlayingFullScreen'"
        (closeView)="closeNowPlayingView()">
      </app-now-playing-view>

      <div *ngSwitchDefault>
        <p>Loading or unknown view...</p> <!-- Default case -->
      </div>
    </div>
  </main>

  <footer class="player-footer" *ngIf="websocketService.mediaPlayerState?.nowPlayingData && currentView !== 'nowPlayingFullScreen'">
    <!-- Player component is always visible at the bottom once we move past profile selection -->
    <app-player></app-player>
  </footer>

  <!-- Alternative strategy: Player is part of the main content area when view is 'player' -->
  <!--
  <div *ngIf="currentView === 'player'" class="dedicated-player-area">
    <app-player></app-player>
  </div>
  -->

  <app-notification
    [message]="currentNotification!"
    *ngIf="currentNotification">
  </app-notification>

  <!-- Add FullScreenSearchComponent here -->
  <app-full-screen-search
    *ngIf="showFullScreenSearch"
    (closeSearch)="toggleFullScreenSearch()"
      [activeProfile]="activeProfileForSearchContext">
  </app-full-screen-search>
</div>
