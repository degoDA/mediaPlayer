<div class="profile-selection-container">
  <!-- Display Profiles List -->
  <div *ngIf="!selectedProfile"> <!-- ID removed -->
    <!-- <h2>Select a Profile</h2> Removed -->
    <div class="cards-container profile-cards-container">
      <div *ngIf="profiles.length === 0" class="loading-message">
        Loading profiles or no profiles found...
      </div>
      <div class="card profile-card" *ngFor="let profile of profiles" (click)="selectProfile(profile)" tabindex="0">
        <div class="card-content">
          <h3 class="card-title">{{ profile.name }}</h3>
          <!-- Optional: could show number of providers if desired -->
          <!-- <p class="card-subtitle" *ngIf="profile.providers">{{ profile.providers.length }} service(s) available</p> -->
        </div>
      </div>
    </div>
  </div>

  <!-- Display Services for Selected Profile -->
  <div *ngIf="selectedProfile"> <!-- ID removed -->
    <!-- <h2>Services for {{ selectedProfile.name }}</h2> Removed -->
    <button class="back-button" (click)="showProfiles()">← Back to Profiles</button>
    <div class="cards-container service-cards-container">
      <div *ngIf="servicesForSelectedProfile.length === 0" class="no-services-message">
        No services found for this profile.
      </div>
      <div class="card service-card" *ngFor="let provider of servicesForSelectedProfile" (click)="selectService(provider)" tabindex="0">
        <div class="card-content">
          <h3 class="card-title">{{ provider.name }}</h3>
        </div>
      </div>
    </div>
  </div>
</div>
