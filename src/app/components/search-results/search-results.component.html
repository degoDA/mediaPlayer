<div class="search-results-container">
  <div *ngIf="isLoading" class="loading-indicator">
    <p>Searching...</p> <!-- Or a spinner component -->
  </div>

  <div *ngIf="!isLoading && results.length === 0" class="no-results-message">
    <p>No results found.</p>
  </div>

  <ul class="results-list" *ngIf="!isLoading && results.length > 0">
    <li *ngFor="let item of results"
        class="result-item"
        (click)="onSelectItem(item)"
        tabindex="0"
        (keydown.enter)="onSelectItem(item)"
        [attr.aria-label]="'Select ' + getItemName(item)">

      <img *ngIf="getIconUrl(item)" [src]="getIconUrl(item)" alt="" class="result-icon">
      <div *ngIf="!getIconUrl(item)" class="result-icon-placeholder">
         <span>{{ getItemName(item) ? getItemName(item)[0] : '?' }}</span>
      </div>

      <div class="result-details">
        <span class="result-name">{{ getItemName(item) }}</span>
        <small *ngIf="getItemType(item)" class="result-type">({{ getItemType(item) }})</small>
        <small class="result-provider-key" *ngIf="item.providerKey">Provider: {{ getProviderDisplayName(item.providerKey) }}</small>
      </div>
    </li>
  </ul>
</div>
