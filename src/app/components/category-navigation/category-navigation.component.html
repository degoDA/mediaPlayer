<div class="category-navigation-container">
  <div class="category-header">
    <h2>{{ currentTitle }}</h2>
    <button (click)="goBack()" class="back-button-catnav">
      &larr; Back
    </button>
  </div>

  <div class="scrollable-category-list-wrapper"> <!-- NEW WRAPPER -->
    <div class="category-list" *ngIf="categories && categories.length > 0; else noCategoriesOrLoading"> <!-- This div will be the grid/flex container -->
      <!-- Card structure for each category -->
      <div class="card category-card"
           *ngFor="let category of categories"
           (click)="selectCategory(category)"
           tabindex="0"
            [attr.aria-label]="'Select ' + category.browseItemName">

      <!-- Image section - only rendered if urlIcon exists -->
      <div class="category-card-image-section" *ngIf="category.urlIcon">
        <img [src]="category.urlIcon"
             alt="{{ category.browseItemName }} icon"
             class="category-icon">
      </div>

      <!-- Details section (name, type, indicator) -->
      <div class="category-card-details-flex-column">
        <div class="category-card-content-section">
          <h4 class="category-name card-title">{{ category.browseItemName || 'Unnamed Category' }}</h4>
          <p class="category-type card-subtitle" *ngIf="category.streamingMediaType">
            {{ category.streamingMediaType }}
          </p>
        </div>

        <div class="category-card-indicator-section" *ngIf="browsableContainerTypes.includes(category.streamingMediaType?.toLowerCase() || '')">
          <span class="indicator">&rarr;</span>
        </div>
      </div>
    </div>
    </div>
    <ng-template #noCategoriesOrLoading>
      <!-- Message for when categories array is empty or not yet loaded -->
      <p class="loading-message">Loading categories or none available for the current selection.</p>
    </ng-template>
  </div>
</div>
