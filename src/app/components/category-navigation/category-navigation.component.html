<div class="category-navigation-container">
  <div class="header">
    <h2>{{ currentTitle }}</h2>
    <button (click)="goBack()" class="back-button">
      &larr; Back
    </button>
  </div>

  <div *ngIf="categories && categories.length > 0; else noCategories" class="category-list">
    <div *ngFor="let category of categories" class="category-item" (click)="selectCategory(category)" [attr.aria-label]="'Select ' + category.browseItemName" tabindex="0">
      <img *ngIf="category.urlIcon" [src]="category.urlIcon" alt="{{ category.browseItemName }} icon" class="category-icon">
      <div class="category-info">
        <span class="category-name">{{ category.browseItemName }}</span>
        <small *ngIf="category.streamingMediaType" class="category-type">{{ category.streamingMediaType }}</small>
      </div>
      <!-- Simple indicator for browsable vs playable, could be an icon -->
      <span *ngIf="browsableContainerTypes.includes(category.streamingMediaType)" class="indicator">&rarr;</span>
    </div>
  </div>

  <ng-template #noCategories>
    <p *ngIf="!currentProviderId">Please select a provider to see categories.</p>
    <p *ngIf="currentProviderId && categories.length === 0">Loading categories or no categories found for the current selection.</p>
  </ng-template>
</div>
