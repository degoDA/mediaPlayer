<!-- Main container for player, visibility handled by *ngIf -->
<div class="player-component" *ngIf="mediaPlayerState?.nowPlayingData; else noTrack">

  <!-- Flex container for album art and track details -->
  <div class="now-playing-info-flex-container">
    <!-- Album art wrapper removed -->

    <div class="track-details-text-wrapper">
      <h3 class="track-title-text" title="{{ trackTitle }}">{{ trackTitle || 'Unknown Title' }}</h3>
      <p class="artist-name-text" title="{{ artistName }}">{{ artistName || 'Unknown Artist' }}</p>
    </div>

    <div class="controls-section"> <!-- MOVED INSIDE -->
      <div class="buttons-container"> <!-- Main buttons -->
        <button class="control-button" (click)="sendPlaybackAction('Previous')" [disabled]="!isActionAvailable('Previous')" aria-label="Previous Track">
          <img alt="play" src="./assets/img/previousWhite.svg">
        </button>
        <button class="control-button play-pause"
                (click)="sendPlaybackAction('PlayPause')"
                [disabled]="!isActionAvailable('PlayPause')"
                aria-label="Play or Pause">
          <span *ngIf="isCurrentlyPausable">
            <img alt="pause" src="./assets/img/pauseBlack.svg">
          </span>
          <span *ngIf="!isCurrentlyPausable">
            <img alt="play" src="./assets/img/playBlack.svg">
          </span>
        </button>
        <button class="control-button" (click)="sendPlaybackAction('Next')" [disabled]="!isActionAvailable('Next')" aria-label="Next Track">
          <img alt="play" src="./assets/img/nextWhite.svg">
        </button>
      </div>
      <div class="secondary-buttons-container" *ngIf="mediaPlayerState?.availableActions?.length"> <!-- Secondary buttons -->
          <button *ngIf="isActionAvailable('Shuffle')"
                  class="control-button secondary"
                  (click)="sendPlaybackAction('Shuffle')"
                  [class.active]="mediaPlayerState?.availableActions?.includes('Shuffle')"
                  aria-label="Shuffle">
            &#x1F500;
          </button>
          <button *ngIf="isActionAvailable('Repeat')"
                  class="control-button secondary"
                  (click)="sendPlaybackAction('Repeat')"
                  [class.active]="mediaPlayerState?.availableActions?.includes('Repeat')"
                  aria-label="Repeat">
            &#x1F501;
          </button>
      </div>
    </div>

    <button class="expand-button" (click)="onExpandClicked()" aria-label="Open full screen player">
      <svg class="expand-svg-icon" viewBox="0 0 24 24" fill="currentColor" width="20px" height="20px">
        <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5V14h-2v3zM14 5v2h3v3h2V5h-5z"/>
        <path d="M0 0h24v24H0z" fill="none"/>
      </svg>
    </button>
  </div>

  <!-- Progress Bar Section REMOVED -->
</div>

<!-- Fallback content when no track is playing -->
<ng-template #noTrack>
  <div class="player-component"> <!-- Ensure consistent outer class for noTrack message styling -->
    <p>No track currently playing or player data is unavailable.</p>
  </div>
</ng-template>
