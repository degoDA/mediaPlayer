<div class="search-container-wrapper">
  <app-search-input (searchQuery)="handleSearchQuery($event)"></app-search-input>

  <div class="results-dropdown" *ngIf="showResults">
    <app-search-results
      [results]="searchResults"
      [isLoading]="isLoading"
      (itemSelected)="handleItemSelected($event)">
    </app-search-results>
  </div>
</div>
